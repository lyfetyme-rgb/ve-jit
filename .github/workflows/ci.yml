name: VE-JIT CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned to a stable image instead of ubuntu-latest, which is migrating to Ubuntu 26.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: ${{ github.workspace }}/backend
        # 'python -m pytest' puts backend/ on sys.path; bare 'pytest' does not, which is why
        # every test module failed collection with ModuleNotFoundError: No module named 'app'.
        run: python -m pytest tests -q
      - name: Run skill contract tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest skills -q
      - name: Validate skill schemas and database isolation
        working-directory: ${{ github.workspace }}
        run: python tools/validate_skills.py

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check edge skill orchestration (run.ts)
        run: npx tsc --noEmit
