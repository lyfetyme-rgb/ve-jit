name: VE-JIT CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: ${{ github.workspace }}/backend
        # 'python -m pytest' puts backend/ on sys.path; bare 'pytest' does not, which is why
        # every test module failed collection with ModuleNotFoundError: No module named 'app'.
        run: python -m pytest tests -q
      - name: Run skill contract tests
        working-directory: ${{ github.workspace }}
        run: python -m pytest skills -q
