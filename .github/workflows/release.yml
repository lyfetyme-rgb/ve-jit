name: Release Edge Bundles

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  verify-gates:
    name: Pre-Release Verification Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies and run full test suite + skill audit
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest tests -q

      - name: Run skill contract tests and validate schemas + isolation
        run: |
          python -m pytest skills -q
          python tools/validate_skills.py

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Run Go vet & race tests
        working-directory: services/sync-go
        run: make test

      - name: Build & UDS integration test C++ Hardware Adapter
        working-directory: services/hardware_adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ nlohmann-json3-dev python3-pytest
          make test

  build-and-package:
    name: Cross-Compile & Package (${{ matrix.arch }})
    needs: verify-gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            apt_packages: "g++"
          - arch: arm64
            goarch: arm64
            apt_packages: "g++-aarch64-linux-gnu binutils-aarch64-linux-gnu"

    steps:
      - uses: actions/checkout@v7

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }} dpkg-dev rsync nlohmann-json3-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-compile C++ Hardware Adapter (${{ matrix.arch }})
        working-directory: services/hardware_adapter
        run: make release ARCH=${{ matrix.arch }}

      - name: Cross-compile Go Sync CLI (${{ matrix.arch }})
        working-directory: services/sync-go
        run: make release GOARCH=${{ matrix.goarch }} VERSION=${{ steps.meta.outputs.VERSION }}

      - name: Build .deb and .tar.gz bundles
        run: |
          chmod +x scripts/package_edge.sh scripts/install-edge.sh
          ./scripts/package_edge.sh "${{ steps.meta.outputs.VERSION }}" "${{ matrix.arch }}"

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vendarix-edge-${{ matrix.arch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-24.04
    # production environment: linked to the production branch, requires manual
    # reviewer approval before any release artifact is published.
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Combine SHA256SUMS
        working-directory: release-assets
        run: cat *.sha256 > SHA256SUMS.txt

      - name: Generate release manifest (SKU -> release mapping)
        working-directory: ${{ github.workspace }}
        run: |
          cd "${{ github.workspace }}"
          VERSION="$(ls release-assets/vendarix-edge_*.tar.gz | head -1 | sed -E 's/^.*vendarix-edge_(.*)_[^_]+\.tar\.gz$/\1/')"
          python tools/release_manifest.py --local-dir release-assets --version "v${VERSION}" --commit "${{ github.sha }}" --out release-assets/manifest.json
          cat release-assets/manifest.json | python -c "import json,sys; m=json.load(sys.stdin); print('manifest OK:', sum(p['file_count'] for p in m['platforms'].values()), 'files across', len(m['platforms']), 'platforms')"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/manifest.json

      - name: Dry-run summary (workflow_dispatch does not publish)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry run complete. Artifacts produced:"
          ls -la release-assets
          echo "Re-run with a pushed v*.*.* tag to publish the release."

