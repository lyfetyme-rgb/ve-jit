apiVersion: v1
kind: ConfigMap
metadata:
  name: vejit-config
  namespace: vejit-platform
data:
  # Non-secret settings. Secrets never appear here.
  AUTH_MODE: "oidc"
  OIDC_ISSUER: "https://idp.example.com"
  OIDC_AUDIENCE: "ve-jit-api"
  OIDC_JWKS_URL: "https://idp.example.com/.well-known/jwks.json"
  OIDC_ROLE_CLAIM: "role"
  OIDC_TENANT_CLAIM: "vejit_tenants"
  OIDC_STORE_CLAIM: "vejit_stores"
  RATE_LIMIT_BACKEND: "redis"
  RATE_LIMIT_PER_MINUTE: "120"
  RATE_LIMIT_BURST: "20"
  CSRF_ENFORCE: "true"
  ALLOWED_ORIGINS: "https://console.example.com"
  PAYMENT_ADAPTER: "tokenized"
  PAYMENT_PSP_URL: "https://psp.example.com/authorize"
  # Managed PostgreSQL is strongly recommended for multi-replica deployments.
  # DATABASE_URL is supplied only through the Secret below.
