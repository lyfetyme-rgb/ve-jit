# TEMPLATE ONLY — do not apply or commit real values.
# Create the real Secret with kubectl/sealed-secrets/external-secrets from your vault:
#   kubectl -n vejit-platform create secret generic vejit-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-file=SECRET_KEY=/run/vault/secret_key \
#     --from-file=POLICY_SIGNING_KEY=/run/vault/policy_key \
#     --from-file=PAYMENT_PSP_TOKEN=/run/vault/psp_token
apiVersion: v1
kind: Secret
metadata:
  name: vejit-secrets
  namespace: vejit-platform
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME_WITH_MANAGED_POSTGRES_URL"
  SECRET_KEY_FILE: "<mounted-secret-key-file>"
  POLICY_SIGNING_KEY_FILE: "<mounted-policy-signing-key-file>"
  PAYMENT_PSP_TOKEN_FILE: "<mounted-psp-token-file>"
  CLOUD_SYNC_TOKEN_FILE: "<mounted-cloud-sync-token-file>"
