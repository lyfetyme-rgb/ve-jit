apiVersion: apps/v1
kind: Deployment
metadata:
  name: vejit-grafana
  namespace: vejit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vejit-grafana
  template:
    metadata:
      labels:
        app: vejit-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
