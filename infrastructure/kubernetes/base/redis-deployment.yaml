apiVersion: apps/v1
kind: Deployment
metadata:
  name: vejit-redis
  namespace: vejit-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vejit-redis
  template:
    metadata:
      labels:
        app: vejit-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
