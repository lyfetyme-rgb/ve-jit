apiVersion: v1
kind: Namespace
metadata:
  name: vejit-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vejit-backend
  namespace: vejit-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vejit-backend
  template:
    metadata:
      labels:
        app: vejit-backend
    spec:
      containers:
      - name: backend
        image: vejit-backend:4.1.0
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vejit-backend
  namespace: vejit-platform
spec:
  type: LoadBalancer
  selector:
    app: vejit-backend
  ports:
  - port: 80
    targetPort: 8000
